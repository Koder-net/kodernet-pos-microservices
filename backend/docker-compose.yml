version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kodernet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kodernet
      POSTGRES_PASSWORD: kodernet_password
      POSTGRES_DB: kodernet_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodernet"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
    container_name: kodernet-auth-service
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env.example
    environment:
      DATABASE_URL: postgresql://kodernet:kodernet_password@postgres:5432/kodernet_auth
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  # Additional services (catalog-service, inventory-service, sales-service, etc.)
  # will be added here incrementally as they are implemented.

volumes:
  postgres_data:
